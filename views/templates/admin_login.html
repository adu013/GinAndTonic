<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - {{ .Title }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .login-box { max-width: 400px; margin: 100px auto; padding: 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-main); }
        .error-message { color: #ef4444; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 Admin Portal</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Sign in to access control management console</p>

        {{ if .Error }}
            <div class="error-message">❌ {{ .Error }}</div>
        {{ end }}

        <form action="/admin/login" method="POST">
            <input type="hidden" name="_csrf" value="{{.csrf}}">
            <div class="form-group">
                <label>Username</label>
                <input type="username" name="username" required placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Authenticate</button>
        </form>
    </div>
</body>
</html>
